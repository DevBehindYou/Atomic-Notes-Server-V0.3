name: Server verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: typecheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process';
          import { writeFileSync } from 'node:fs';
          const checked = spawnSync('npm', ['run', 'typecheck', '--', '--pretty', 'false'], {
            encoding: 'utf8', maxBuffer: 1024 * 1024,
          });
          const owned = new Set(['src/lib/sessionManagement.ts', 'src/routes/auth.ts', 'tests/sessionManagement.fixture.test.ts']);
          const found = [...(checked.stdout ?? '').matchAll(/^([^\r\n]+)\((\d+),(\d+)\): error TS(\d+):/gm)];
          const diagnostics = found.slice(0, 32).map(match => ({
            file: owned.has(match[1]) ? match[1] : 'other',
            line: owned.has(match[1]) ? Math.min(Number(match[2]), 10000) : 0,
            column: owned.has(match[1]) ? Math.min(Number(match[3]), 10000) : 0,
            code: 'TS' + match[4],
          }));
          const pass = checked.status === 0;
          writeFileSync('ci-session-typecheck-diagnostics.json', JSON.stringify({ version: 1,
            scope: 'bounded TypeScript location and code diagnostics; no compiler messages',
            outcome: pass ? 'pass' : 'fail', overflow: found.length > 32, diagnostics }));
          console.log(JSON.stringify({ typecheck: pass ? 'pass' : 'fail', diagnostic_count: diagnostics.length }));
          process.exitCode = pass ? 0 : 1;
          NODE
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Build
        run: npm run build
      - name: Load compiled entrypoint under plain Node ESM (what Vercel runs)
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017
        run: |
          node --input-type=module -e "const m = await import('./dist/api/index.js'); const r = await m.default.fetch(new Request('https://localhost/api/health')); if (r.status !== 200) throw new Error('health returned ' + r.status); console.log('compiled entrypoint ok'); process.exit(0)"
      - name: Unit tests
        run: npm test
      - name: Start disposable MongoDB replica set
        run: |
          docker run -d --name atomic-test-mongo -p 127.0.0.1:27017:27017 mongo:7.0 --replSet rs0 --bind_ip_all
          for attempt in {1..30}; do
            if docker exec atomic-test-mongo mongosh --quiet --eval 'db.adminCommand({ping:1})'; then break; fi
            sleep 2
          done
          docker exec atomic-test-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          for attempt in {1..30}; do
            if docker exec atomic-test-mongo mongosh --quiet --eval 'if (!db.hello().isWritablePrimary) quit(1)'; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Database and API integration tests
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0&directConnection=true
        run: npm run test:integration
      - name: Disposable admin pagination baseline
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0&directConnection=true
        run: npm run benchmark:admin-pages
      - name: Disposable client HTTP fixture smoke
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0&directConnection=true
        run: npm run test:client-fixture
      - name: MongoDB failure diagnostics
        # Only the explicitly selected fixed-code artifact is retrieved by review.
        if: failure()
        run: docker logs atomic-test-mongo || true
      - name: Upload sanitized capped refund proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanitized-capped-refund-proof
          path: ci-capped-refund-proof.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload sanitized refund credit reader proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanitized-refund-credit-reader-proof
          path: ci-refund-credit-reader-proof.json
          if-no-files-found: ignore
          retention-days: 1
      - name: Remove disposable MongoDB
        # Test artifacts never contain raw assertions or payloads.
        if: always()
        run: docker rm -f atomic-test-mongo || true
      - name: Upload sanitized encrypted payload proof
        if: always()
        uses: actions/upload-artifact@v4
